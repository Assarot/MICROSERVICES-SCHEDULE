version: '3.8'

services:
  postgres:
    image: postgres:latest
    container_name: ms-schedule-postgres
    environment:
      POSTGRES_DB: schedule_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5436:5432"
    volumes:
      - postgres-schedule-data:/var/lib/postgresql
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d schedule_db"]
      interval: 10s
      timeout: 5s
      retries: 5

