version: '3.8'

services:
  postgres-course:
    image: postgres:latest
    container_name: postgres-course-db
    environment:
      POSTGRES_DB: course_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5439:5432"
    volumes:
      - postgres-course-data:/var/lib/postgresql
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d course_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-course-data:

networks:
  microservices-network:
    driver: bridge
