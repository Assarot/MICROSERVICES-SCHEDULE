version: '3.8'

services:

  # ============================================================
  # SOLO BASES DE DATOS — los microservicios corren localmente
  # con: mvn spring-boot:run
  # ============================================================

  # DB-1: MS-AUTH (puerto 5434)
  postgres-auth:
    image: postgres:latest
    container_name: ms_auth_postgres
    environment:
      POSTGRES_DB: ms_auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres-auth-data:/var/lib/postgresql
    networks:
      - microservices-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d ms_auth_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # DB-2: MS-USER (puerto 5435)
  postgres-user:
    image: postgres:latest
    container_name: ms-user-postgres
    environment:
      POSTGRES_DB: ms_user_db
